name: bulon-stock

services:
  sqlserver:
    # SQL Server solo se publica para amd64; en Apple Silicon corre emulado (Rosetta en Docker Desktop).
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: bulon-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Bulon_Dev_2026!}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Crea la base bulon_stock (si no existe) y termina. Las tablas las crea Flyway al iniciar el backend.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Bulon_Dev_2026!}
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init.sql"]
    restart: "no"

volumes:
  sqlserver-data:
